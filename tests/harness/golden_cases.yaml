# Where-Is-It AI: four starter golden cases
# All records are synthetic examples based on SPEC v1, not real camera measurements.
# Scope: historical-record selection only; a sighting does not prove the current location.

minimum_confirmed_confidence: 0.75 
confidence_comparison: ">="       

cases:
  - name: gc_01_latest_reliable_history
    context:
      object_name: wallet
      records:
        - {fixture_id: wallet-latest, object: wallet, location: bed, timestamp: '2026-10-28T13:50:00+09:00', confidence: 0.85}
        - {fixture_id: wallet-older, object: wallet, location: desk, timestamp: '2026-10-28T09:00:00+09:00', confidence: 0.98}
        - {fixture_id: unrelated-glasses, object: glasses, location: table, timestamp: '2026-10-28T14:00:00+09:00', confidence: 0.99}
    expect_record: wallet-latest
    must_min_confidence: 0.75
    must_exclude: [wallet-older, unrelated-glasses]
    note: >-
      Normal case. Select the latest reliable wallet sighting, not the highest-confidence
      record (wallet-older, 0.98) and not the newer sighting of another object
      (unrelated-glasses). The result is historical evidence, not confirmation that the
      wallet is on the bed now. (AC-04, AC-05)

  - name: gc_02_phone_exactly_75_percent
    context:
      object_name: phone
      records:
        - {fixture_id: phone-boundary, object: phone, location: table, timestamp: '2026-10-28T13:00:00+09:00', confidence: 0.75}
    expect_record: phone-boundary
    must_min_confidence: 0.75
    note: >-
      Boundary case. The confidence equals the minimum threshold (SPEC 6.2 row 1).
      policy.confidence_comparison is ">=", so 0.75 qualifies. (AC-05, 6.3)

  - name: gc_03_below_75_percent
    context:
      object_name: glasses
      records:
        - {fixture_id: glasses-low, object: glasses, location: sofa, timestamp: '2026-10-28T13:00:00+09:00', confidence: 0.749}
    expect_record: null
    must_exclude: [glasses-low]
    note: >-
      Forbidden-behaviour case. A raw score of 0.749 is below 0.75, so it cannot confirm a
      sighting and there is no other reliable history (SPEC 6.2 row 3). Return None without
      rounding the score up. Offering the sofa as an unconfirmed `possible` answer is AC-06
      and belongs to a later feature. (AC-05)

  - name: gc_04_no_records
    context:
      object_name: earphones
      records: []
    expect_record: null
    note: >-
      Boundary case. No historical evidence is available (SPEC 6.2 row 4). Return None
      instead of inventing a location, timestamp or confidence. This does not prove that
      the earphones are absent from the room. (AC-05)