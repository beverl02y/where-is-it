project: Where-Is-It AI
version: mini-ontology

vocabulary:
  items:
    - glasses
    - wallet
    - card
    - earphones
    - phone
    - charger
    - hairtie

  places:
    - desk
    - table
    - bed
    - bedside_table
    - bag
    - drawer
    - cupboard
    - sofa
    - under_table
    - held_by_person
    - other

  item_aliases:
    glasses: [안경]
    wallet: [지갑, "card wallet", "card purse", "카드 지갑"]
    card: [카드, 학생증, "student card"]
    earphones: [이어폰, 에어팟, earbuds, AirPods]
    phone: [휴대폰, 핸드폰, 폰, smartphone]
    charger: [충전기]
    hairtie: ["hair tie", 머리끈]

  place_aliases:
    desk: [책상]
    table: [테이블]
    bed: [침대]
    bedside_table: ["bedside table", 협탁, "침대 옆 탁자"]
    bag: [가방]
    drawer: [서랍]
    cupboard: [찬장]
    sofa: [소파, couch]
    under_table: ["under the table", "테이블 아래"]
    held_by_person: ["held by a person", "사람이 들고 있음"]
    other: [기타]

  alias_rules:
    - Canonical names are also valid. Preserve the original Query wording.
    - Prefer the longest matching phrase, so card wallet maps to wallet rather than card.
    - Preserve appearance and relative-location details; ask if the object remains ambiguous.
    - desk and table remain distinct place values.

policy:
  min_confirmed_confidence: 0.75
  confidence_comparison: ">="

evidence_sources:
  interviews:
    file: interview_answers.md
    kind: supplied_interview_responses

  spike_plan:
    file: spikes_2026-10-07_where-is-it.md
    kind: technical_test_design

  design:
    file: SPEC.md
    kind: solution_design

  query_schema:
    file: query.schema.json
    kind: interface_design
    
validation_scope:
  historical_spike:
    item_subset: [glasses, wallet, card, earphones, phone, hairtie]
    place_subset: [table, under_table, sofa, held_by_person]
    evidence_source: spike_plan
    limitation: Historical results apply only to this subset and the evaluated images.

purpose:
  en: >
    Where-Is-It AI aims to help university students reduce the time spent
    searching for everyday belongings in one room. It uses images from a
    single camera to record supported items' locations and detection times,
    then answers natural-language questions using the latest reliable
    record. Only items visible to the camera can be detected, and the
    last recorded location does not guarantee the item's current location.

  ko: >
    Where-Is-It AI는 대학생이 방 안에서 일상 소지품을 찾는 데 드는
    시간을 줄이는 것을 목표로 한다. 카메라 한 대의 이미지에서 지원
    대상 물건의 위치와 감지 시각을 기록하고, 자연어 질문에 가장 최근의
    신뢰할 수 있는 기록을 바탕으로 답한다. 카메라에 보이는 물건만
    탐지할 수 있으며, 마지막 기록 위치가 현재 위치를 보장하지는 않는다.

entities:
  Object:
    evidence: [{source: interviews, participant: 3, question: 3}, {source: interviews, participant: 10, question: 3}]
    attributes:
      name:
        type: string
        description: Descriptive item name, such as black wallet.
        evidence: [{source: interviews, participant: 6, question: 2}, {source: design, section: "5"}]
      category:
        type: string
        allowed_values_ref: vocabulary.items
        evidence: [{source: interviews, participant: 3, question: 2}, {source: interviews, participant: 6, question: 2}, {source: interviews, participant: 7, question: 2}, {source: interviews, participant: 10, question: 2}]
      usualPlace:
        type: string
        nullable: true
        allowed_values_ref: vocabulary.places
        description: Explicitly user-provided usual place; null when unknown.
        evidence: [{source: interviews, participant: 1, question: 5}, {source: interviews, participant: 6, question: 5}, {source: interviews, participant: 10, question: 5}]

  Place:
    evidence: [{source: interviews, participant: 6, question: 5}, {source: interviews, participant: 10, question: 6}]
    attributes:
      name:
        type: string
        allowed_values_ref: vocabulary.places
        evidence: [{source: interviews, participant: 1, question: 5}, {source: interviews, participant: 2, question: 6}, {source: interviews, participant: 4, question: 5}, {source: interviews, participant: 10, question: 5}, {source: interviews, participant: 10, question: 6}, {source: spike_plan, section: "4. Method"}, {source: design, decision: "other is a fallback place label"}]

  Query:
    kind: interaction_design
    evidence: [{source: query_schema, pointer: "#/definitions/Query"}]
    attributes:
      questionText:
        type: string
        description: Exact original utterance; always required.
        evidence: [{source: query_schema, pointer: "#/definitions/Query/properties/questionText"}]
      objectName:
        type: string
        nullable: true
        description: Exact item phrase; required key, null if no item is identifiable.
        evidence: [{source: interviews, participant: 3, question: 2}, {source: query_schema, pointer: "#/definitions/Query/properties/objectName"}]
      questionType:
        type: string
        optional: true
        allowed_values: [current_location, last_seen, disappeared_when, nearby_context, where_to_look]
        description: Parsed intent; event analysis and exact disappearance time remain outside v1.
        evidence: [{source: query_schema, pointer: "#/definitions/Query/properties/questionType"}]
      urgency:
        type: string
        optional: true
        allowed_values: [high, low]
        evidence: [{source: interviews, participant: 3, question: 8}, {source: interviews, participant: 5, question: 8}]
      checkedPlaces:
        type: array
        items: {type: string}
        optional: true
        description: Explicitly searched places, preserving the user's words.
        evidence: [{source: interviews, participant: 6, question: 5}, {source: interviews, participant: 6, question: 6}, {source: interviews, participant: 10, question: 6}]
      lastUsedPlace:
        type: string
        optional: true
        description: User's stated memory; not a camera observation.
        evidence: [{source: interviews, participant: 1, question: 9}, {source: interviews, participant: 6, question: 9}, {source: interviews, participant: 10, question: 9}]

  Detection:
    kind: solution_design
    evidence: [{source: design, section: "4.2"}, {source: spike_plan, section: "4. Method"}]
    attributes:
      location:
        type: string
        allowed_values_ref: vocabulary.places
        evidence: [{source: design, section: "4.2"}, {source: spike_plan, section: "4. Method"}]
      timestamp:
        type: string
        format: date-time
        description: Image capture time with timezone.
        evidence: [{source: design, section: "4.2"}]
      confidence:
        type: number
        range: [0, 1]
        confirmation_threshold_ref: policy.min_confirmed_confidence
        comparison_ref: policy.confidence_comparison
        evidence: [{source: spike_plan, section: "3. Success Criteria"}]
      visibility:
        type: string
        optional: true
        allowed_values: [visible, partially_occluded, unknown]
        description: Image-supported visibility; never infer a fully hidden item's location.
        evidence: [{source: interviews, participant: 2, question: 3}, {source: interviews, participant: 6, question: 9}, {source: interviews, participant: 10, question: 9}, {source: design, decision: "visibility labels model the interview limitation"}]

  Response:
    kind: interface_design
    evidence: [{source: design, section: "5"}]
    attributes:
      location_or_last_seen:
        type: object
        nullable: true
        fields:
          location: {type: string, allowed_values_ref: vocabulary.places}
          timestamp: {type: string, format: date-time}
          evidence_kind: {type: string, allowed_values: [latest_frame, history]}
        description: Selected observation's place, capture time, and evidence kind; null without a reliable record.
        evidence: [{source: design, section: "5"}, {source: design, decision: "typed representation of the existing location_or_last_seen output"}]
      confidence_level:
        type: number
        nullable: true
        range: [0, 1]
        description: Selected record's confidence score; null without a selected record.
        evidence: [{source: design, section: "5"}, {source: spike_plan, section: "3. Success Criteria"}]
      possibility_suggestion:
        type: string
        nullable: true
        description: Explicitly unconfirmed hint from the user's last-used or usual place; null without supporting context.
        evidence: [{source: interviews, participant: 1, question: 9}, {source: interviews, participant: 6, question: 9}, {source: interviews, participant: 10, question: 9}, {source: design, decision: "user-memory hints are separate from recorded observations"}]
      fact_vs_possibility_disclaimer:
        type: string
        description: Explain observation time and uncertainty, or ask for clarification when needed.
        evidence: [{source: design, section: "6.2"}]

relationships:
  - subject: Object
    relation: has
    object: Detection
    cardinality: "1:0..many"
    description: One object may have zero or more recorded observations.
    evidence: [{source: design, section: "4.2"}]

  - subject: Object
    relation: usuallyAt
    object: Place
    cardinality: "0..many:0..1"
    description: An object may have one explicitly user-provided usual place.
    evidence: [{source: interviews, participant: 1, question: 5}, {source: interviews, participant: 6, question: 5}, {source: interviews, participant: 10, question: 5}]

  - subject: Query
    relation: asksAbout
    object: Object
    cardinality: "0..many:0..1"
    description: Resolve at most one object per Query; ask for clarification if missing or ambiguous.
    evidence: [{source: query_schema, pointer: "#/definitions/Query/properties/objectName"}, {source: design, section: "6.2"}]

  - subject: Detection
    relation: observedAt
    object: Place
    cardinality: "0..many:1"
    description: Each detection records one observed place.
    evidence: [{source: design, section: "4.2"}, {source: spike_plan, section: "4. Method"}]

  - subject: Query
    relation: produces
    object: Response
    cardinality: "1:1"
    description: Each Query produces one response, including a clarification or safe failure when needed.
    evidence: [{source: design, section: "5"}]

  - subject: Response
    relation: basedOn
    object: Detection
    cardinality: "0..many:0..1"
    description: A response uses at most one selected detection; none when no reliable record exists.
    evidence: [{source: design, section: "6.1"}, {source: design, section: "6.2"}]

reasoning_rules:
  - >
    Resolve the requested object before selecting a detection. Ask for clarification
    when its name is missing or ambiguous. Distinguish an unsupported item class
    from a supported item with no reliable record.
  - >
    Use only image-supported detections whose confidence satisfies
    policy.min_confirmed_confidence using policy.confidence_comparison.
    Partial occlusion still requires sufficient visible evidence to identify the item.
    Never infer a fully hidden item's location from confidence alone.
  - >
    Prefer a qualifying detection from the latest frame available for the query.
    Otherwise, select the requested object's most recent qualifying historical
    detection by image capture time. If equally recent records conflict on location,
    explain the uncertainty instead of choosing arbitrarily.
  - >
    Return the selected observation's capture time and evidence kind.
    Explain that a recorded location does not guarantee the item's current location.
    A missed detection is not proof that the item is absent from the room.
  - >
    checkedPlaces records the user's search history. It does not invalidate a
    reliable detection or prove that the item is hidden at that place.
  - >
    With no reliable detection, location_or_last_seen and confidence_level are null.
    An unconfirmed possibility_suggestion may use the explicit lastUsedPlace,
    otherwise the explicitly user-provided usualPlace. Label its user-memory source.
    Without such context, possibility_suggestion is also null.
  - >
    Explain the limitation when asked for an exact disappearance time or nearby
    events. Return any reliable last-seen record only as recorded evidence.
    Do not invent events or attribute movement to a person or pet.

output:
  fields_ref: entities.Response.attributes
  rule: Return all four defined fields; use null where the attribute permits it.
